[package]
name = "cerune-wat-host"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cerune-lang = { path = "../.." }
wasmi = "=2.0.2"
serde_json = "1.0"

[target.'cfg(all(target_arch = "x86_64", any(all(windows, target_env = "msvc"), all(target_os = "linux", target_env = "gnu"))))'.dependencies]
cerune-lang = { path = "../..", features = ["process-c-abi"] }
