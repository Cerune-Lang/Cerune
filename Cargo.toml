[package]
name = "cerune-lang"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Cerune-Lang/Cerune"
description = "A small experimental programming language designed to keep the path from source code to generated code observable."
publish = false
license = "MIT OR Apache-2.0"

[package.metadata.dist]
dist = true

[[bin]]
name = "cerune"
path = "src/main.rs"

[[example]]
name = "lean_verification"
path = "experiments/lean/main.rs"

[[example]]
name = "ssa_model"
path = "experiments/ssa/main.rs"

[[example]]
name = "host_calls"
path = "experiments/host_calls/main.rs"

[[example]]
name = "wat_library"
path = "experiments/host_calls/library.rs"

[[example]]
name = "call_depth_probe"
path = "experiments/call_depth/main.rs"

[[example]]
name = "call_depth_emit_c"
path = "experiments/call_depth/emit_c.rs"

[[example]]
name = "call_depth_emit"
path = "experiments/call_depth/emit.rs"

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
goblin = { version = "0.10.7", default-features = false, features = ["std", "elf32", "elf64", "pe64", "endian_fd"] }
sashimi-assembler = { git = "https://github.com/Cerune-Lang/SASHIMI.git", rev = "ee8f6b132aea322af3d4ff1909035c7903836cd5" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
