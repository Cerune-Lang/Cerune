[package]
name = "cerune-lang"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Cerune-Lang/Cerune"
description = "A small experimental programming language designed to keep the path from source code to generated code observable."
publish = false
license = "MIT OR Apache-2.0"

[package.metadata.dist]
dist = true

[[bin]]
name = "cerune"
path = "src/main.rs"

[[example]]
name = "lean_verification"
path = "experiments/lean/main.rs"

[[example]]
name = "ssa_model"
path = "experiments/ssa/main.rs"

[[example]]
name = "host_calls"
path = "experiments/host_calls/main.rs"

[[example]]
name = "wat_library"
path = "experiments/host_calls/library.rs"

[dependencies]
sashimi-assembler = { git = "https://github.com/Cerune-Lang/SASHIMI.git", rev = "68edab5badc905c84ad74754f6fa1aed2be5b808" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
