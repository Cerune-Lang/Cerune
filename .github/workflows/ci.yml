name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Documentation links and translation pairs
        run: |
          node scripts/check-docs.cjs
          node --test scripts/check-docs.test.cjs
      - name: Install execution validation tools
        run: |
          mkdir -p target
          curl --fail --location https://c9x.me/compile/release/qbe-1.3.tar.xz -o target/qbe-1.3.tar.xz
          echo 'd587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  target/qbe-1.3.tar.xz' | sha256sum --check
          tar -xf target/qbe-1.3.tar.xz -C target
          make -C target/qbe-1.3
          npm install --prefix target/wasm-tools --no-audit --no-fund wabt@1.0.39
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: |
          # 意図したtrapをOSのクラッシュ収集へ送らず、終了状態と診断を検証します。
          # pipe型のcore_patternではulimitだけでは収集を止められません。
          sysctl kernel.core_pattern
          sudo sysctl -w kernel.core_pattern=core
          ulimit -c 0
          timeout --kill-after=10s 8m bash -o pipefail -c 'cargo test --all-targets 2>&1 | tee target/ci-tests.log'
        env:
          CERUNE_TEST_TRACE: "1"
          CERUNE_TEST_CC: clang
          CERUNE_TEST_ASM_CLANG: clang
          CERUNE_TEST_LLVM_CLANG: clang
          CERUNE_TEST_QBE: ${{ github.workspace }}/target/qbe-1.3/qbe
          CERUNE_TEST_NODE: node
          CERUNE_TEST_OBJDUMP: objdump
          CERUNE_TEST_WAT2WASM_JS: ${{ github.workspace }}/target/wasm-tools/node_modules/wabt/bin/wat2wasm
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-log
          path: target/ci-tests.log
          if-no-files-found: ignore
      - name: C strings, u64, and dynamic array sanitizer checks
        run: |
          ulimit -c 0
          cargo test --test c_strings --test dynamic_arrays
        env:
          CERUNE_TEST_CC: clang
          CERUNE_TEST_SANITIZE: "1"

  lean-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [lean_verification, lean_ssa]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned Lean
        run: |
          mkdir -p target/lean-verification-test
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o target/lean.tar.zst
          echo '47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  target/lean.tar.zst' | sha256sum --check
          tar --zstd -xf target/lean.tar.zst -C target
      - name: Check proofs, execution, and rejected mutations
        shell: bash
        run: cargo test --test ${{ matrix.suite }} -- --include-ignored --test-threads=1 2>&1 | tee target/lean-verification-test/test.log
        env:
          CERUNE_TEST_LEAN: ${{ github.workspace }}/target/lean-4.34.1-linux/bin/lean
      - name: Preserve Lean observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-${{ matrix.suite }}
          path: target/lean-verification-test
          if-no-files-found: ignore

  windows-qbe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Build pinned QBE 1.3 for the Windows host
        shell: msys2 {0}
        run: |
          mkdir -p target
          curl --fail --location https://c9x.me/compile/release/qbe-1.3.tar.xz -o target/qbe-1.3.tar.xz
          echo 'd587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  target/qbe-1.3.tar.xz' | sha256sum --check
          tar -xf target/qbe-1.3.tar.xz -C target
          make -C target/qbe-1.3 CC=gcc CFLAGS='-std=c99 -O2' LDFLAGS=-static -j2
          target/qbe-1.3/qbe.exe -h
      - name: Compare Windows QBE execution with IR and VM
        shell: pwsh
        run: |
          $env:CERUNE_TEST_QBE_CLANG = (Get-Command clang).Source
          cargo test --test qbe_windows --test qbe_output --test dynamic_arrays --test explicit_flush --test stdin_routes -- --include-ignored 2>&1 | Tee-Object target/qbe-windows-test.log
          exit $LASTEXITCODE
        env:
          CERUNE_TEST_TRACE: "1"
          CERUNE_TEST_QBE: ${{ github.workspace }}/target/qbe-1.3/qbe.exe
      - name: Preserve generation stages and execution results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qbe-windows-observations
          path: |
            target/qbe-windows-observations
            target/qbe-windows-test.log
            target/stdin-*
          if-no-files-found: ignore

  windows-strings:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Install WAT validation tool
        run: npm install --prefix target/wasm-tools --no-audit --no-fund wabt@1.0.39
      - name: Compare strings, u64, assembly, and machine artifacts on Windows
        run: cargo test --lib --test wat_output --test native_output --test llvm_strings --test c_strings --test string_routes --test native_assembly --test runtime_routes --test source_files --test modules --test product_updates --test constants --test sums --test array_length --test array_iteration --test constant_array_lengths --test generic_functions --test truncating_conversions --test rounding_conversions --test aggregate_values --test string_concat --test string_heap_routes --test ir_executor --test mir_executor --test ssa_executor --test ssa_cli --test ssa_native --test observation_bundle --test native_mir --test dynamic_arrays --test explicit_flush --test execution_output --test execution_output_cli --test line_input --test standard_input --test stdin_routes --test c_output --test llvm_output
        env:
          CERUNE_TEST_CC: clang
          CERUNE_TEST_LLVM_CLANG: clang
          CERUNE_TEST_ASM_CLANG: clang
          CERUNE_TEST_OBJDUMP: llvm-objdump
          CERUNE_TEST_NODE: node
          CERUNE_TEST_WAT2WASM_JS: ${{ github.workspace }}/target/wasm-tools/node_modules/wabt/bin/wat2wasm
